<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel</title>
<script>(function(){try{var t=localStorage.getItem('ewi_admin_theme');if(!t)t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js" crossorigin="anonymous"></script>
<style>
:root{--brand:#6c5ce7;--brand2:#00c2ff;--accent:#ff4d8d;--gold:#ffc83d;--ok:#12b886;--warn:#f59f00;--bad:#f03e3e;
--bg:#f3f4fb;--card:#ffffff;--text:#161a3a;--muted:#6b7099;--line:#e6e8f5;--soft:#f6f7fd;--shadow:0 6px 24px rgba(40,44,110,.08);
--grad:linear-gradient(135deg,var(--brand),var(--brand2) 60%,var(--accent));--side:268px}
html[data-theme=dark]{--bg:#0c0e24;--card:#161a3d;--text:#eef0ff;--muted:#9aa0d0;--line:#252a55;--soft:#1b2048;--shadow:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;transition:background .3s,color .3s}
[hidden]{display:none!important}
.material-icons-round{font-size:20px;vertical-align:middle;line-height:1;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--brand)}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.01em}
small,.muted{color:var(--muted)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

/* boot + auth */
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:90}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.auth{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 10% 0,rgba(108,92,231,.35),transparent),radial-gradient(800px 500px at 100% 100%,rgba(255,77,141,.28),transparent),var(--bg)}
.auth-card{width:100%;max-width:410px;background:var(--card);border-radius:26px;padding:30px 26px;box-shadow:0 20px 60px rgba(30,30,90,.25);border:1px solid var(--line);animation:rise .5s both}
.logo{width:66px;height:66px;border-radius:20px;background:var(--grad);display:grid;place-items:center;color:#fff;margin:0 auto 14px;box-shadow:0 10px 28px rgba(108,92,231,.45)}
.logo .material-icons-round{font-size:34px}
.auth-card h2{text-align:center;font-size:22px}.auth-card>p{text-align:center;color:var(--muted);margin:4px 0 20px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.note{display:flex;gap:10px;padding:11px 13px;border-radius:13px;font-size:12.5px;background:rgba(245,159,0,.12);color:var(--text);border:1px solid rgba(245,159,0,.35);margin-bottom:14px}
.note.info{background:rgba(108,92,231,.1);border-color:rgba(108,92,231,.3)}
.note.bad{background:rgba(240,62,62,.1);border-color:rgba(240,62,62,.35)}
.note .material-icons-round{flex:none;color:var(--warn)}.note.info .material-icons-round{color:var(--brand)}.note.bad .material-icons-round{color:var(--bad)}

/* shell */
.app{display:flex;min-height:100%}
.side{width:var(--side);flex:none;position:fixed;inset:0 auto 0 0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transition:transform .3s}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 12px}
.brand .logo{width:42px;height:42px;border-radius:13px;margin:0;box-shadow:0 6px 16px rgba(108,92,231,.4)}.brand .logo .material-icons-round{font-size:23px}
.brand b{display:block;font-size:15px;line-height:1.15}.brand small{font-size:11.5px}
.nav{flex:1;overflow:auto;padding:4px 12px 12px}
.nav h6{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:16px 8px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:500;transition:background .2s,color .2s;margin-bottom:2px}
.nav a .material-icons-round{color:var(--muted);transition:color .2s}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.35)}.nav a.on .material-icons-round{color:#fff}
.nav a .bdg{margin-left:auto;background:var(--accent);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.side-foot{padding:12px;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--soft)}
.me .av,#meAv{width:40px!important;height:40px!important;min-width:40px!important;max-width:40px!important;min-height:40px!important;max-height:40px!important;flex:0 0 40px!important;aspect-ratio:1/1;border-radius:50%!important;align-self:center;overflow:hidden}.me div{min-width:0;flex:1}.me b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me small{font-size:11px}
.main{flex:1;margin-left:var(--side);min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{font-size:19px}.grow{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:.2s}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
#menuBtn{display:none}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--bad)}.live.on i{background:var(--ok);box-shadow:0 0 0 0 rgba(18,184,134,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(18,184,134,0)}100%{box-shadow:0 0 0 0 rgba(18,184,134,0)}}
.view{padding:22px;max-width:1280px;margin:0 auto;animation:rise .35s both}
.scrim{position:fixed;inset:0;background:rgba(10,12,40,.55);z-index:35;opacity:0;pointer-events:none;transition:.3s}
/* anti-glitch: own GPU layers, no backdrop blur on mobile */
.side{will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.nav{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translateZ(0)}
.scrim{will-change:opacity}
@media(max-width:899px){.top{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}.shw{-webkit-backdrop-filter:none;backdrop-filter:none}}
@media(max-width:899px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}.scrim.on{opacity:1;pointer-events:auto}.main{margin-left:0}#menuBtn{display:grid}.top{padding:10px 14px}.view{padding:14px}.live span{display:none}.live{padding:8px}}

/* basics */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.block{margin-bottom:18px}
.blk-h{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}
.blk-h h3{font-size:16px;display:flex;align-items:center;gap:8px}.blk-h h3 .material-icons-round{color:var(--brand)}
.blk-h p{color:var(--muted);font-size:12.5px;margin-top:2px}
.blk-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:13px;font-weight:600;background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.3);transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.btn:active{transform:none}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ghost{background:var(--soft);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.ok{background:linear-gradient(135deg,#12b886,#38d9a9);box-shadow:0 8px 20px rgba(18,184,134,.3)}
.btn.danger{background:linear-gradient(135deg,#f03e3e,#ff6b6b);box-shadow:0 8px 20px rgba(240,62,62,.28)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}.btn.full{width:100%}
.in,.fld input[type=text],.fld input[type=number],.fld input[type=url],.fld input[type=password],.fld input[type=email],.fld select,.fld textarea,.search input,.flt select,.flt input{width:100%;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--text);font:inherit;outline:0;transition:.2s}
.in:focus,.fld input:focus,.fld select:focus,.fld textarea:focus,.search input:focus,.flt select:focus,.flt input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(108,92,231,.14);background:var(--card)}
.fld textarea{resize:vertical;min-height:84px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.fld.err input,.fld.err textarea,.fld.err select{border-color:var(--bad)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fld{grid-column:1/-1}.fld.half{grid-column:span 1}
@media(max-width:560px){.fld.half{grid-column:1/-1}}
.fld>label{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px}.fld>label b{color:var(--bad)}
.fld>small{display:block;margin-top:5px;font-size:11.5px}
.search{position:relative;min-width:200px}.search input{padding-left:36px}.search .material-icons-round{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:19px}
.sw{position:relative;display:inline-block;width:46px;height:26px}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.25s;cursor:pointer}
.sw i:before{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:before{transform:translateX(20px)}
.swrow{display:flex;align-items:center;gap:12px}.swrow span{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 6px 5px 11px;border-radius:99px;background:rgba(108,92,231,.12);color:var(--brand);font-weight:600;font-size:12.5px}
.chip button{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(108,92,231,.2)}.chip .material-icons-round{font-size:14px}
.chiprow{display:flex;gap:8px}
.optrow{display:flex;gap:9px;align-items:center;margin-bottom:8px}.optrow input[type=radio]{accent-color:var(--ok);width:18px;height:18px;flex:none}
.optrow .tag{font-weight:700;color:var(--muted);width:18px}
.imgprev{margin-top:8px;border-radius:14px;overflow:hidden;background:var(--soft);border:1px dashed var(--line);display:none;max-height:170px}.imgprev img{display:block;width:100%;max-height:170px;object-fit:contain}.imgprev.on{display:block}
.crow{display:grid;grid-template-columns:120px 1fr 1.4fr auto;gap:8px;margin-bottom:8px}
@media(max-width:560px){.crow{grid-template-columns:1fr 1fr}.crow>*:nth-child(3){grid-column:1/-1}}
.eye{position:relative}.eye button{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted)}.eye input{padding-right:42px!important}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:13px;padding:12px 6px;border-bottom:1px solid var(--line);transition:background .2s}
.row:last-child{border-bottom:0}.row.click{cursor:pointer}.row.click:hover{background:var(--soft);border-radius:12px}
.row .thumb{width:46px;height:46px;border-radius:13px;object-fit:cover;background:var(--soft);display:grid;place-items:center;color:var(--brand);flex:none;overflow:hidden}
.row .thumb img{width:100%;height:100%;object-fit:cover}
.row .mid{flex:1;min-width:0}.row .mid b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .mid small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:flex;gap:6px;flex:none}
.act{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);transition:.2s}.act:hover{background:var(--brand);color:#fff;border-color:var(--brand)}.act.del:hover{background:var(--bad);border-color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:34px 10px}.empty .material-icons-round{font-size:42px;opacity:.5;display:block;margin:0 auto 6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.ok{background:rgba(18,184,134,.14);color:var(--ok)}.badge.warn{background:rgba(245,159,0,.16);color:var(--warn)}.badge.bad{background:rgba(240,62,62,.13);color:var(--bad)}.badge.brand{background:rgba(108,92,231,.14);color:var(--brand)}
.av{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;text-transform:uppercase;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.coin{display:inline-flex;align-items:center;gap:5px;font-weight:700}.coin:before{content:'৳';display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#5b4200;font-size:11px}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:shim 1.3s infinite;min-height:18px}@keyframes shim{to{background-position:-200% 0}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;color:var(--muted);transition:.2s}.tab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(108,92,231,.3)}.tab em{font-style:normal;opacity:.8;margin-left:5px;font-size:12px}
.flt{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.flt>*{flex:1;min-width:130px}
.more{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:14px;color:var(--muted)}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;display:flex;gap:13px;align-items:center}
.stat .si{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}.stat .si .material-icons-round{font-size:25px}
.stat b{display:block;font-size:22px;line-height:1.1}.stat span{color:var(--muted);font-size:12.5px}.stat small{display:block;font-size:11.5px;margin-top:2px}
.g1{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}.g2{background:linear-gradient(135deg,#00b4d8,#48cae4)}.g3{background:linear-gradient(135deg,#12b886,#63e6be)}.g4{background:linear-gradient(135deg,#f59f00,#ffd43b)}.g5{background:linear-gradient(135deg,#ff4d8d,#ff8fab)}.g6{background:linear-gradient(135deg,#845ef7,#da77f2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.grid3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:18px}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}.legend{display:flex;flex-direction:column;gap:9px;margin-top:6px}.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px}.legend i{width:10px;height:10px;border-radius:50%}.legend b{margin-left:auto}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}.donut svg{width:150px;height:150px}.donut .legend{flex:1;min-width:130px}

/* users / tx */
.urow{display:grid;grid-template-columns:minmax(180px,1.6fr) 1fr 1fr 1fr 110px;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px}
.urow:hover{background:var(--soft)}.urow.hd{cursor:default;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}.urow.hd:hover{background:none}
.urow .u{display:flex;align-items:center;gap:11px;min-width:0}.urow .u div{min-width:0}.urow .u b,.urow .u small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:760px){.urow{grid-template-columns:1fr auto}.urow.hd{display:none}.urow>.c2,.urow>.c4,.urow>.c1{display:none}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.kv div{background:var(--soft);border-radius:14px;padding:11px 13px}.kv small{display:block;font-size:11.5px}.kv b{font-size:16px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px}.dl dt{color:var(--muted)}.dl dd{word-break:break-word;font-weight:500}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}

/* sheet / dialog */
.shw{position:fixed;inset:0;z-index:70;display:flex;justify-content:flex-end;background:rgba(10,12,40,.55);backdrop-filter:blur(3px);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:min(580px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.3);animation:slide .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.sheet.wide{width:min(760px,100%)}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--card)}.sh-h h3{flex:1;font-size:17px}
.sh-b{flex:1;overflow:auto;padding:18px}.sh-f{display:flex;gap:10px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap}
@media(max-width:700px){.shw{align-items:flex-end}.sheet,.sheet.wide{width:100%;height:auto;max-height:93vh;border-radius:24px 24px 0 0;animation:up .3s both}@keyframes up{from{transform:translateY(40px);opacity:0}}}
.dlg{margin:auto;width:min(420px,calc(100% - 28px));background:var(--card);border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:rise .25s both;align-self:center}
.shw.c{justify-content:center;align-items:center}.dlg h3{margin-bottom:6px}.dlg p{color:var(--muted);margin-bottom:14px;white-space:pre-line}.dlg .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:9px;max-width:calc(100% - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:14px;background:#1c2050;color:#fff;box-shadow:0 12px 34px rgba(0,0,0,.35);animation:rise .3s both;font-weight:500}
.toast.ok .material-icons-round{color:#38d9a9}.toast.bad{background:#a51d2d}.toast.bad .material-icons-round{color:#ffc9c9}

/* support */
.chat{display:grid;grid-template-columns:320px 1fr;gap:0;height:calc(100vh - 130px);min-height:480px;padding:0;overflow:hidden}
.clist{border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}.clist .search{padding:12px;min-width:0}.clist .search .material-icons-round{left:24px}
.ci{display:flex;gap:11px;align-items:center;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}.ci:hover{background:var(--soft)}.ci.on{background:rgba(108,92,231,.12)}
.ci .mid{flex:1;min-width:0}.ci .mid b{display:flex;justify-content:space-between;gap:8px}.ci .mid b em{font-style:normal;font-weight:500;font-size:11px;color:var(--muted)}.ci .mid small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpane{display:flex;flex-direction:column;min-width:0;min-height:0}
.ch{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line)}.ch .mid{flex:1;min-width:0}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}

/* ====================== CRYPTO (PBKDF2-SHA256) ====================== */
const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');

const K256 = new Uint32Array([0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);

function sha256bytes(bytes, H0, prefixLen) {

function earnSwitch(ctx, f, compact) {

const earnCard = (ctx, f) => { const c = h(`<section class="card block"><div class="blk-h"><div><h3>${ico('visibility')} Visibility</h3><p>Hide or show “${esc(f[1])}” in the user’s Earn page. Takes effect instantly.</p></div></div></section>`); c.appendChild(earnSwitch(ctx, f, true)); return c; };
/* ---- instant on/off cards: invert=true => stored value true means HIDDEN ; invert=false => stored value is the setting itself (default on) ---- */
function flagCard(ctx, o) {
  const c = h(`<section class="card block"><div class="blk-h"><div><h3>${ico(o.icon || 'visibility')} ${esc(o.title)}</h3><p>${esc(o.desc)}</p></div></div><div class="swrow" style="margin:0"><label class="sw"><input type="checkbox" checked><i></i></label><span><b>${esc(o.label)}</b> <small class="muted" data-st></small></span></div></section>`);
  const cb = $('input', c), st = $('[data-st]', c), txt = on => on ? o.onText : o.offText;
  ctx.listen(o.path, s => { const v = s.val(); const on = o.invert ? v !== true : (o.defOff ? v === true : v !== false); cb.checked = on; st.textContent = txt(on); st.style.color = on ? '' : 'var(--bad,#ff5252)'; });
  cb.addEventListener('change', async () => { const on = cb.checked; try { await db.ref(o.path).set(o.invert ? !on : on); toast(txt(on)); } catch (e) { cb.checked = !on; fail(e, 'Could not update'); } });

}

    actions: [{ icon: 'visibility', label: 'Turn on / off', fn: async i => { try { await db.ref('appSettings/withdrawSteps/' + i._k).update({ enabled: i.enabled === false }); toast(i.enabled === false ? 'Step is now active' : 'Step turned off'); } catch (e) { fail(e, 'Could not update'); } } }] });
